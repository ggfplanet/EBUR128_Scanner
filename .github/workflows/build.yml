name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Unit Tests
      run: |
        python -m unittest discover tests
    - name: Download fully static FFmpeg binaries
      run: |
        python download_ffmpeg_win.py
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --icon="assets/icon.ico" --add-data "assets;assets" --add-data "LICENSE;." --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --name "EBUR128Scanner" main.py
    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EBUR128Scanner-win
        path: "dist/EBUR128Scanner/*"
