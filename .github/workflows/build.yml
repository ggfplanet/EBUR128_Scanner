name: Build Windows & Linux Applications

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Unit Tests
      run: |
        python -m unittest discover tests
    - name: Download fully static FFmpeg binaries
      run: |
        python download_ffmpeg_win.py
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --icon="assets/icon.ico" --add-data "assets;assets" --add-data "LICENSE;." --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --name "EBUR128Scanner" main.py
    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EBUR128Scanner-win
        path: "dist/EBUR128Scanner/*"

  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 xvfb
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Unit Tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m unittest discover tests
    - name: Download fully static Linux x64 FFmpeg binaries
      run: |
        python download_ffmpeg_linux.py --arch=x64
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --add-data "assets:assets" --add-data "LICENSE:." --add-binary "ffmpeg:." --add-binary "ffprobe:." --name "EBUR128Scanner" main.py
    - name: Upload Linux x64 Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EBUR128Scanner-linux-x64
        path: "dist/EBUR128Scanner/*"

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 xvfb
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Unit Tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m unittest discover tests
    - name: Download fully static Linux arm64 FFmpeg binaries
      run: |
        python download_ffmpeg_linux.py --arch=arm64
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --add-data "assets:assets" --add-data "LICENSE:." --add-binary "ffmpeg:." --add-binary "ffprobe:." --name "EBUR128Scanner" main.py
    - name: Upload Linux arm64 Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EBUR128Scanner-linux-arm64
        path: "dist/EBUR128Scanner/*"
