name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Pre-download FFmpeg binaries
      run: |
        python -c "import static_ffmpeg; static_ffmpeg.add_paths()"
    - name: Build with PyInstaller (onedir for fast startup)
      run: |
        pyinstaller --noconfirm --onedir --windowed --icon="logo_tim/EBUR128_scanner_icon-macOS-Default-1024x1024@1x.png" --collect-all static_ffmpeg --name "EBUR128Scanner" main.py
    - name: Debug - List Dist Directory
      run: |
        ls -R dist/
    - name: Compile Inno Setup Installer
      run: |
        iscc installer_windows.iss
    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EBU_R_128_Scanner_Windows_Setup
        path: "dist/installer/*.exe"
