name: Build Windows & Linux Applications

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Unit Tests
      run: |
        python -m unittest discover tests
    - name: Download fully static FFmpeg binaries
      run: |
        python download_ffmpeg_win.py
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --icon="assets/icon.ico" --add-data "assets;assets" --add-data "LICENSE;." --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --name "EBUR128Scanner" main.py
    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EBUR128Scanner-win
        path: "dist/EBUR128Scanner/*"

  build-linux-x64:
    runs-on: ubuntu-latest
    container: python:3.10-bullseye
    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 zip xvfb
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Unit Tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m unittest discover tests
    - name: Download fully static Linux x64 FFmpeg binaries
      run: |
        python download_ffmpeg_linux.py --arch=x64
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --add-data "assets:assets" --add-data "LICENSE:." --add-binary "ffmpeg:." --add-binary "ffprobe:." --name "EBUR128Scanner" main.py
    - name: Package Linux x64 Bundle (preserving symlinks & host GPU compatibility)
      run: |
        cp assets/EBUR128_scanner_icon-macOS-Default-1024x1024@1x.png dist/EBUR128Scanner/icon.png
        rm -f dist/EBUR128Scanner/_internal/libstdc++.so* dist/EBUR128Scanner/_internal/libgcc_s.so* dist/EBUR128Scanner/_internal/libdrm.so* dist/EBUR128Scanner/_internal/libgbm.so*
        cd dist/EBUR128Scanner
        zip -r -y -q ../../EBUR128Scanner-linux-x64-bundle.zip .
    - name: Upload Linux x64 Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EBUR128Scanner-linux-x64
        path: EBUR128Scanner-linux-x64-bundle.zip

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    container: python:3.10-bullseye
    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 zip xvfb
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Unit Tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m unittest discover tests
    - name: Download fully static Linux arm64 FFmpeg binaries
      run: |
        python download_ffmpeg_linux.py --arch=arm64
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --add-data "assets:assets" --add-data "LICENSE:." --add-binary "ffmpeg:." --add-binary "ffprobe:." --name "EBUR128Scanner" main.py
    - name: Package Linux arm64 Bundle (preserving symlinks & host GPU compatibility)
      run: |
        cp assets/EBUR128_scanner_icon-macOS-Default-1024x1024@1x.png dist/EBUR128Scanner/icon.png
        rm -f dist/EBUR128Scanner/_internal/libstdc++.so* dist/EBUR128Scanner/_internal/libgcc_s.so* dist/EBUR128Scanner/_internal/libdrm.so* dist/EBUR128Scanner/_internal/libgbm.so*
        cd dist/EBUR128Scanner
        zip -r -y -q ../../EBUR128Scanner-linux-arm64-bundle.zip .
    - name: Upload Linux arm64 Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EBUR128Scanner-linux-arm64
        path: EBUR128Scanner-linux-arm64-bundle.zip
