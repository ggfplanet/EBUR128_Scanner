name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build with PyInstaller (onedir for fast startup)
      run: |
        pyinstaller --noconfirm --onedir --windowed --icon="logo_tim/EBUR128_scanner_icon-macOS-Default-1024x1024@1x.png" --name "EBU R 128 Scanner" main.py
    - name: Compile Inno Setup Installer
      run: |
        "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer_windows.iss
    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EBU_R_128_Scanner_Windows_Setup
        path: "dist/installer/*.exe"
