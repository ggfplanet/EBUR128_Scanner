name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --windowed --icon="logo_tim/EBUR128_scanner_icon-macOS-Default-1024x1024@1x.png" --name "EBUR128_Scanner" main.py
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EBUR128_Scanner_Windows
        path: dist/EBUR128_Scanner*
